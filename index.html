<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de sécurité</title>
    
    <!-- Script officiel de Cloudflare Turnstile -->
    <script src="https://cloudflare.com" async defer></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .captcha-screen { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        
        /* Cache le contenu du site par défaut */
        #main-content { display: none; }
    </style>
</head>
<body>

    <!-- ÉCRAN DE VÉRIFICATION ANTI-ROBOT -->
    <div id="captcha-container" class="captcha-screen">
        <div class="box">
            <h2>Vérification de sécurité</h2>
            <p>Veuillez cocher la case ci-dessous pour accéder au site.</p>
            
            <!-- REMPLACEZ "VOTRE_SITE_KEY_ICI" PAR LA CLÉ COPIÉE SUR CLOUDFLARE -->
            <div class="cf-turnstile" 
                 data-sitekey="VOTRE_SITE_KEY_ICI" 
                 data-callback="onCaptchaSuccess">
            </div>
        </div>
    </div>

    <!-- LE CONTENU DE VOTRE SITE ORIGINAL (Disque) -->
    <div id="main-content">
        
        <!-- -------------------------------------------------------- -->
        <!-- COLLEZ TOUT LE CONTENU DE VOTRE SITE ORIGINAL ICI DEDANS -->
        <h1>Bienvenue sur votre espace Disk</h1>
        <p>Le contenu de votre page index.html d'origine va ici...</p>
        <!-- -------------------------------------------------------- -->

    </div>

    <!-- Script JavaScript pour afficher le site après validation -->
    <script>
        function onCaptchaSuccess(token) {
            // Si le jeton Cloudflare est valide, on masque le captcha et on affiche le site
            if (token) {
                document.getElementById('captcha-container').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }
    </script>
</body>
</html>
